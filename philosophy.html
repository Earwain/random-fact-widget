<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Philosophy & Thought for the Day</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: 'Space Grotesk', sans-serif;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 10px 14px;
    }

    .widget {
      width: 100%;
      height: 100%;
      border: 1px solid #1e293b;
      background: #0f172a;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 4px;
    }

    .tag {
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #38bdf8;
      font-weight: 700;
    }

    .topic {
      font-size: 0.58rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .quote-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 6px 0;
      overflow: hidden;
    }

    .quote-text {
      font-family: 'Fraunces', serif;
      font-size: 0.78rem;
      line-height: 1.32;
      color: #f1f5f9;
      font-style: italic;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .author {
      margin-top: 4px;
      font-size: 0.65rem;
      font-weight: 500;
      color: #94a3b8;
      text-align: right;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #1e293b;
      padding-top: 4px;
    }

    .source-label {
      font-size: 0.58rem;
      color: #475569;
    }

    button {
      background: transparent;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.62rem;
      font-weight: 600;
      padding: 2px 8px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    button:hover {
      background: #38bdf8;
      color: #090d16;
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="header">
      <span class="tag" id="tag">Ant Philosophy</span>
      <span class="topic" id="topic">Core Pillar 1</span>
    </div>

    <div class="quote-wrap">
      <div class="quote-text" id="quote">Ants never quit. If they're headed somewhere and you try to stop them, they'll look for another way. Over, under, or around.</div>
      <div class="author" id="author">— Jim Rohn</div>
    </div>

    <div class="footer">
      <span class="source-label" id="cycle-indicator">Wisdom Engine</span>
      <button onclick="nextThought()">Next</button>
    </div>
  </div>

 <script>
  async function loadThought() {
    const quote = document.getElementById('quote');
    const author = document.getElementById('author');
    const topic = document.getElementById('topic');
    const tag = document.getElementById('tag');

    tag.textContent = 'Daily Philosophy';
    topic.textContent = 'Thought for today';
    quote.textContent = 'Consulting the wisdom archives…';
    author.textContent = '';

    try {
      const response = await fetch('https://zenquotes.io/api/today');
      const data = await response.json();
      const item = data[0];

      quote.textContent = item.q;
      author.textContent = '— ' + item.a;
    } catch (error) {
      quote.textContent = 'The wisdom archive is temporarily unavailable.';
      author.textContent = '';
    }
  }

  function nextThought() {
    loadThought();
  }

  loadThought();
</script>
</body>
</html>
