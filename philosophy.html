<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Philosophy & Daily Wisdom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: 'Space Grotesk', sans-serif;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      padding: 8px 12px;
    }

    .widget {
      width: 100%;
      height: 100%;
      border: 1px solid #1e293b;
      background: #0f172a;
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 4px;
    }

    .tag {
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #38bdf8;
      font-weight: 700;
    }

    .topic {
      font-size: 0.55rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .quote-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 4px 0;
      overflow: hidden;
    }

    .quote-text {
      font-family: 'Fraunces', serif;
      font-size: 0.74rem;
      line-height: 1.3;
      color: #f1f5f9;
      font-style: italic;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .author {
      margin-top: 3px;
      font-size: 0.62rem;
      font-weight: 500;
      color: #94a3b8;
      text-align: right;
    }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #1e293b;
      padding-top: 4px;
    }

    .source-label {
      font-size: 0.55rem;
      color: #475569;
    }

    button {
      background: transparent;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 0.58rem;
      font-weight: 600;
      padding: 2px 7px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    button:hover {
      background: #38bdf8;
      color: #090d16;
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="header">
      <span class="tag" id="tag">Philosophy</span>
      <span class="topic" id="topic">Thought for Today</span>
    </div>

    <div class="quote-wrap">
      <div class="quote-text" id="quote">Consulting the archives…</div>
      <div class="author" id="author"></div>
    </div>

    <div class="footer">
      <span class="source-label" id="cycle-indicator">Wisdom Archive</span>
      <button onclick="nextThought()">Next</button>
    </div>
  </div>

  <script>
    // Fallback seed catalog: Ant Philosophy, Stoics & Thinkers
    const localWisdom = [
      { q: "Ants never quit. If they're headed somewhere and you try to stop them, they'll look for another way: over, under, or around.", a: "Jim Rohn", t: "Ant Philosophy" },
      { q: "Ants think winter all summer. You cannot be so naive as to think summer will last forever; gather in abundance.", a: "Jim Rohn", t: "Ant Philosophy" },
      { q: "Ants think summer all winter. In the bitter cold, they remind themselves: this won't last long, warmth returns.", a: "Jim Rohn", t: "Ant Philosophy" },
      { q: "How much will an ant gather in summer for the winter? All that he possibly can. Give all you can.", a: "Jim Rohn", t: "Ant Philosophy" },
      { q: "You have power over your mind, not outside events. Realize this, and you will find strength.", a: "Marcus Aurelius", t: "Stoic Wisdom" },
      { q: "Waste no more time arguing about what a good man should be. Be one.", a: "Marcus Aurelius", t: "Stoic Wisdom" },
      { q: "We suffer more often in imagination than in reality.", a: "Seneca", t: "Stoic Wisdom" },
      { q: "He who has a why to live can bear almost any how.", a: "Friedrich Nietzsche", t: "Philosophy" },
      { q: "Make the rough ashlar smooth; constant refinement shapes both structure and character.", a: "Ancient Craft", t: "Craft & Order" },
      { q: "The impediment to action advances action. What stands in the way becomes the way.", a: "Marcus Aurelius", t: "Stoic Wisdom" }
    ];

    let quotesPool = [...localWisdom];
    let currentIndex = 0;

    async function initQuotes() {
      try {
        // Fetch a public curated collection via jsDelivr CDN (100% CORS-friendly)
        const res = await fetch('https://cdn.jsdelivr.net/gh/devchallenge-io/curated-quotes@main/quotes.json');
        if (res.ok) {
          const remoteQuotes = await res.json();
          // Filter out excessively long quotes that won't fit a 2x1 DevOps tile
          const suitable = remoteQuotes
            .filter(item => (item.quote || item.text) && (item.quote || item.text).length < 130)
            .map(item => ({
              q: item.quote || item.text,
              a: item.author || "Unknown",
              t: "Daily Wisdom"
            }));
          if (suitable.length > 0) {
            // Keep the core Ant philosophies at the top, then append the external repository
            quotesPool = [...localWisdom, ...suitable];
          }
        }
      } catch (e) {
        // Silently use the rich local backup if CDN is unreachable
      }

      // Pick a deterministic quote based on day-of-year
      const dayOfYear = Math.floor((new Date() - new Date(new Date().getFullYear(), 0, 0)) / 86400000);
      currentIndex = dayOfYear % quotesPool.length;
      displayCurrent();
    }

    function displayCurrent() {
      const item = quotesPool[currentIndex];
      document.getElementById('tag').textContent = item.t || "Wisdom";
      document.getElementById('topic').textContent = `#${currentIndex + 1} of ${quotesPool.length}`;
      document.getElementById('quote').textContent = item.q;
      document.getElementById('author').textContent = '— ' + item.a;
    }

    function nextThought() {
      currentIndex = (currentIndex + 1) % quotesPool.length;
      displayCurrent();
    }

    initQuotes();
  </script>
</body>
</html>
